databases:
  - name: autosender-db
    plan: free

services:
  - type: web
    name: autosender-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: SETUP_SECRET
        generateValue: true
      - key: CREDENTIALS_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: autosender-db
          property: connectionString
      # Set in Render dashboard (required for cloud Read/Online + Dream re-login):
      # - key: TWOCAPTCHA_API_KEY
      # - key: DREAM_PROXY_URL  (optional alternative)
