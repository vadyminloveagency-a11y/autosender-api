databases:
  - name: autosender-db
    plan: free

services:
  # Operator cloud mailings (LetterBot / Sender). Keep this URL for the Chrome extension.
  # autoDeploy: false — director pushes must NOT restart mailing workers.
  - type: web
    name: autosender-api
    runtime: node
    plan: free
    autoDeploy: false
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ROLE
        value: workers
      - key: JWT_SECRET
        sync: false
      - key: SETUP_SECRET
        sync: false
      - key: CREDENTIALS_SECRET
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: autosender-db
          property: connectionString

  # Director cabinet. Auto-deploys from main; does not run mailing workers.
  - type: web
    name: autosender-admin
    runtime: node
    plan: free
    autoDeploy: true
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ROLE
        value: admin
      # Public URL of autosender-api, e.g. https://autosender-api.onrender.com
      - key: WORKERS_API_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SETUP_SECRET
        sync: false
      - key: CREDENTIALS_SECRET
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: autosender-db
          property: connectionString
